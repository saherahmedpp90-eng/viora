function track(n, d) { try { if (window.ttq) window.ttq.track(n, d); } catch (e) {} }
class DCLogic {
  constructor() { this.props = {}; this.state = {}; }
  setState(p) { if (typeof p === 'function') p = p(this.state); Object.assign(this.state, p); schedule(); }
  forceUpdate() { schedule(); }
}

class Component extends DCLogic {
  renderVals() {
    const phone = '96560484454';
    const wa = (text) => 'https://wa.me/' + phone + '?text=' + encodeURIComponent(text);
    const fmt = (n) => String(parseFloat(n.toFixed(3)));
    const menu = [
      { id: 'h', name: 'هوت شوكليت', price: 23 },

    ];
    const qty = (this.state && this.state.qty) || { h: 0, m: 0, a: 0, s: 0, b: 0, r: 0 };
    const setQ = (id, delta) => {
      if (delta > 0 && (qty.a + qty.s + qty.b + qty.r) === 0) track('AddToCart', { content_type: 'product', content_name: 'VIORA coffee order' });
      this.setState({ qty: Object.assign({}, qty, { [id]: Math.max(0, qty[id] + delta) }) });
    };
    let totalCups = 0;
    let totalPrice = 0;
    const lines = [];
    const calcItems = menu.map((m) => {
      const sub = qty[m.id] * m.price / 20;
      totalCups += qty[m.id];
      totalPrice += sub;
      const temp = (this.state && this.state.temp) || 'بارد';
      const sw = (this.state && this.state.sweet && this.state.sweet[m.id]) || 'مظبوط';
      const setSw = (v) => this.setState({ sweet: Object.assign({}, (this.state && this.state.sweet) || {}, { [m.id]: v }) });
      if (qty[m.id] > 0) lines.push('- ' + m.name + (m.id === 's' ? ' (' + temp + ')' : '') + ' (سكر: ' + sw + '): ' + qty[m.id] + ' كوب');
      return {
        showHead: m.id === 'h' || m.id === 'a',
        headText: m.id === 'h' ? '❄ مشروبات الشتاء' : 'المشروبات',
        hasTemp: m.id === 's' && qty.s > 0,
        hasQty: qty[m.id] > 0,
        hasGift: (m.id === 'h' || m.id === 'm') && qty[m.id] > 0,
        bitCls: sw === 'مر' ? 'on' : '',
        medCls: sw === 'مظبوط' ? 'on' : '',
        extCls: sw === 'زيادة' ? 'on' : '',
        setBit: () => setSw('مر'),
        setMed: () => setSw('مظبوط'),
        setExt: () => setSw('زيادة'),
        hotCls: temp === 'حار' ? 'on' : '',
        coldCls: temp === 'بارد' ? 'on' : '',
        setHot: () => this.setState({ temp: 'حار' }),
        setCold: () => this.setState({ temp: 'بارد' }),
        name: m.name,
        rate: m.price + ' د.ك لكل 20 كوب',
        qty: qty[m.id],
        sub: fmt(sub),
        minus: () => setQ(m.id, -10),
        plus: () => setQ(m.id, 10)
      };
    });
    const DELIVERY_FEE = 3;
    const FAR = ['ام الهيمان', 'الخيران', 'المطلاع', 'الوفره', 'العبدلي', 'السالمي', 'جبد', 'جابر الاحمد', 'صباح الاحمد'];
    const norm = (t) => String(t || '').replace(/[\u064B-\u0652\u0640]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[^\u0621-\u064Aa-z0-9\s]/gi, ' ').replace(/\s+/g, ' ').trim().replace(/(^| )ال/g, '$1');
    const area = (this.state && this.state.area) || '';
    const na = norm(area);
    const farHit = na.length > 1 && FAR.some((a) => (' ' + na + ' ').indexOf(' ' + norm(a) + ' ') !== -1);
    const feeOf = (t) => { const n = ' ' + norm(t) + ' '; return n.indexOf(' وفره ') !== -1 ? 5 : DELIVERY_FEE; };
    const delivery = farHit ? feeOf(area) : 0;
    const STAND_FEE = 3;

    const grand = totalPrice + delivery + (stand ? STAND_FEE : 0);
    const isFar = (t) => { const n = norm(t); return n.length > 1 && FAR.some((a) => (' ' + n + ' ').indexOf(' ' + norm(a) + ' ') !== -1); };

      name: x.name,

      pick: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ area: x.name, areaOpen: false }); }
    }));
    const msg = totalCups > 0
      ? 'السلام عليكم VIORA، أبي أحجز الطلب التالي:\n' + lines.join('\n') + '\nالإجمالي: ' + fmt(totalPrice) + ' د.ك (' + totalCups + ' كوب). ممكن تأكدون لي التفاصيل؟'

(function () {
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  var app = document.getElementById('app');
  var tplEl = document.createElement('template');
  tplEl.innerHTML = document.getElementById('tpl').textContent;
  var comp = new Component();
  var pending = false;

  function lookup(p, scope) {
    p = p.trim();
    if (p === 'true') return true;
    if (p === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(p)) return Number(p);
    var v = scope, parts = p.split('.');
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(str, scope) { return str.replace(HOLE, function (m, p) { var v = lookup(p, scope); return v == null ? '' : String(v); }); }

  function buildChildren(parent, scope, out) { for (var n = parent.firstChild; n; n = n.nextSibling) build(n, scope, out); }

  function build(node, scope, out) {
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'template') {
      if (node.hasAttribute('data-if')) { if (lookup(node.getAttribute('data-if'), scope)) buildChildren(node.content, scope, out); return; }
      if (node.hasAttribute('data-for')) {
        var list = lookup(node.getAttribute('data-for'), scope) || [], as = node.getAttribute('data-as');
        for (var i = 0; i < list.length; i++) { var s = Object.create(scope); s[as] = list[i]; s.$index = i; buildChildren(node.content, s, out); }
        return;
      }
    }
    var el = document.createElementNS(node.namespaceURI, tag);
    var handlers = {}, val;
    for (var k = 0; k < node.attributes.length; k++) {
      var a = node.attributes[k], n = a.name, v = a.value, m = v.match(WHOLE);
      if (n.indexOf('hint-') === 0) continue;
      if (n.indexOf('on') === 0 && m) { handlers[n.slice(2)] = lookup(m[1], scope); continue; }
      var str = m ? (function (r) { return r == null ? '' : String(r); })(lookup(m[1], scope)) : interp(v, scope);
      if (n === 'value' && (tag === 'input' || tag === 'select')) { val = str; continue; }
      el.setAttribute(n, str);
    }
    buildChildren(node, scope, el);
    if (val !== undefined) { el.__val = val; el.value = val; }
    el.__h = handlers;
    out.appendChild(el);
  }

  function syncChildren(oldP, newP) {
    var nc = Array.prototype.slice.call(newP.childNodes), oc = Array.prototype.slice.call(oldP.childNodes);
    for (var i = 0; i < nc.length; i++) {
      var a = oc[i], b = nc[i];
      if (!a) { oldP.appendChild(b); continue; }
      if (a.nodeType === 3 && b.nodeType === 3) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; continue; }
      if (a.nodeType === 1 && b.nodeType === 1 && a.nodeName === b.nodeName && a.namespaceURI === b.namespaceURI) { syncEl(a, b); continue; }
      oldP.replaceChild(b, a);
    }
    for (var j = oc.length - 1; j >= nc.length; j--) oldP.removeChild(oc[j]);
  }
  function syncEl(a, b) {
    var i, at;
    for (i = a.attributes.length - 1; i >= 0; i--) { at = a.attributes[i]; if (!b.hasAttribute(at.name)) a.removeAttribute(at.name); }
    for (i = 0; i < b.attributes.length; i++) { at = b.attributes[i]; if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value); }
    a.__h = b.__h;
    syncChildren(a, b);
    if (b.__val !== undefined) { a.__val = b.__val; if (a.value !== b.__val) a.value = b.__val; }
  }

  function render() {
    pending = false;
    var vals = comp.renderVals();
    var frag = document.createDocumentFragment();
    buildChildren(tplEl.content, vals, frag);
    syncChildren(app, frag);
  }
  window.schedule = function () { if (!pending) { pending = true; Promise.resolve().then(render); } };

  function dispatch(e, keys, bubble) {
    var el = e.target;
    while (el && el !== app && el.nodeType === 1) {
      var h = el.__h;
      if (h) for (var i = 0; i < keys.length; i++) if (h[keys[i]]) { h[keys[i]](e); return; }
      if (!bubble) return;
      el = el.parentNode;
    }
  }
  app.addEventListener('click', function (e) { dispatch(e, ['click'], true); });
  app.addEventListener('mousedown', function (e) { dispatch(e, ['mousedown'], true); });
  app.addEventListener('input', function (e) { dispatch(e, ['change', 'input'], false); });
  app.addEventListener('change', function (e) { dispatch(e, ['change'], false); });
  app.addEventListener('focus', function (e) { dispatch(e, ['focus'], false); }, true);
  app.addEventListener('blur', function (e) { dispatch(e, ['blur'], false); }, true);

  render();
})();
